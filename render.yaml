services:
  - type: web
    name: sparkle-reading-passbook-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      # Restrict CORS to your deployed Netlify URL once you know it, e.g.
      # https://your-site-name.netlify.app — defaults to "*" (any origin) if unset.
      - key: ALLOWED_ORIGIN
        sync: false
    disk:
      name: sync-store
      mountPath: /var/data
      sizeGB: 1
